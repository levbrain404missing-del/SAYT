# Пример блока Caddy для этого приложения.
# Вставить в /etc/caddy/Caddyfile, заменив домен и порт на свои.
#
# ВАЖНО: порядок действий на сервере — backup -> validate -> reload:
#   sudo cp -a /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak-$(date +%F-%H%M)
#   sudo caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
#   sudo systemctl reload caddy        # reload, НЕ restart

# Вариант 1 — обычный сайт на 80/443 (если порты свободны).
# https://example.com {
# 	encode zstd gzip
# 	reverse_proxy 127.0.0.1:3100 {
# 		header_up X-Forwarded-Proto https
# 	}
# }

# Вариант 2 — нестандартный порт (если 443 занят другим сервисом).
# http-блок нужен только чтобы Let's Encrypt мог пройти HTTP-01 challenge
# и чтобы заход по http уводил на правильный https-адрес с портом.
http://reg.example.com {
	redir https://reg.example.com:8443{uri} permanent
}

https://reg.example.com:8443 {
	encode zstd gzip
	reverse_proxy 127.0.0.1:3100 {
		header_up X-Forwarded-Proto https
	}
}
